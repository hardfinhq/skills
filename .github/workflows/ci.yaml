name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check release
        run: python3 scripts/check_release.py
      # A virtual environment keeps the test dependency off the runner's system Python.
      - name: Install test dependency
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install openpyxl==3.1.5
      - name: Test release checks
        run: python3 -I tests/check_release_test.py
      - name: Test file inspector
        run: '"$RUNNER_TEMP/venv/bin/python" -I tests/inspect_files_test.py'
